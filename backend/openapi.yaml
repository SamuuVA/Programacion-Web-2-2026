      properties:
        nombreCompleto:
          type: string
          minLength: 1
        correoElectronico:
          type: string
          minLength: 1
          format: email
        documentoIdentidad:
          $ref: '#/components/schemas/DocumentoIdentidad'
        credencial:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
        nombreComercial:
          type: string
          minLength: 1
          maxLength: 120
        bodega:
          $ref: '#/components/schemas/WarehouseInput'
    RegisterSellerResponse:
      type: object
