          format: uuid
        destinatario:
          type: string
          minLength: 1
        telefono:
          type: string
          minLength: 1
        linea1:
          type: string
          minLength: 1
        linea2:
          type: [string, 'null']
        ciudad:
          type: string
          minLength: 1
        region:
          type: string
          minLength: 1
        codigoPostal:
          type: [string, 'null']
        pais:
          type: string
          pattern: '^[A-Z]{2}$'
        esPrincipal:
          type: boolean
        creadaEn:
          type: string
          format: date-time
        actualizadaEn:
          type: string
          format: date-time
    CreateAddressRequest:
