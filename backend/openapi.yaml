              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Persistencia no disponible.
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotReadyResponse'
components:
  parameters:
    CorrelationIdHeader:
      name: x-correlation-id
      in: header
      required: false
      description: |
        Identificador de correlación. Si falta o no cumple el patrón, el servidor
        genera un UUID y lo devuelve en la respuesta.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: nexus_session
      description: Cookie HttpOnly emitida por `/api/v1/auth/login`.
    BearerAuth:
      type: http
      scheme: bearer
      description: Token de sesión devuelto por `/api/v1/auth/login`.
  headers:
    CorrelationId:
      description: Correlación de la petición.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
    Allow:
      description: Métodos admitidos para la ruta solicitada.
      schema:
        type: string
        examples:
          - "GET, HEAD"
  responses:
    NotFound:
      description: La ruta no existe.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: La ruta existe, pero el método HTTP no está permitido.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
        allow:
          $ref: '#/components/headers/Allow'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Cuerpo o parámetros inválidos.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: No hay sesión válida o las credenciales no son correctas.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: La sesión es válida, pero el rol o el ámbito no permiten la operación.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicto de unicidad (correo o documento ya registrado).
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Regla de negocio incumplida (stock, precio, estado o dirección).
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Dependencia de persistencia no disponible.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Error interno no controlado.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RegisterBuyerRequest:
      type: object
      additionalProperties: false
      required:
        - nombreCompleto
        - correoElectronico
        - documentoIdentidad
        - credencial
      properties:
        nombreCompleto:
          type: string
          minLength: 1
          description: Se normalizan espacios. No se impone un máximo no aprobado.
        correoElectronico:
          type: string
          minLength: 1
          format: email
          description: Se normaliza a minúsculas y se usa para la unicidad.
        documentoIdentidad:
          $ref: '#/components/schemas/DocumentoIdentidad'
        credencial:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: Se transforma a Argon2id (DEC-W1-008); nunca se devuelve ni se audita.
    DocumentoIdentidad:
      type: object
      additionalProperties: false
      required: [tipo, pais, numero]
      properties:
        tipo:
          type: string
          minLength: 1
        pais:
          type: string
          minLength: 1
        numero:
          type: string
          minLength: 1
    RegisterBuyerResponse:
      type: object
      additionalProperties: false
      required:
        - usuarioId
        - compradorId
        - carritoId
        - estadoUsuario
        - estadoComercial
        - correoNormalizado
      properties:
        usuarioId:
          type: string
          format: uuid
        compradorId:
          type: string
          format: uuid
        carritoId:
          type: string
          format: uuid
        estadoUsuario:
          type: string
          enum: [ACTIVO]
        estadoComercial:
          type: string
          enum: [HABILITADO]
        correoNormalizado:
          type: string
          format: email
    CategoriaProducto:
      type: string
      enum: [ELECTRONICA, ROPA, HOGAR, DIGITAL]
    PrecioProducto:
      type: object
      additionalProperties: false
      required: [montoCentavos, moneda]
      properties:
        montoCentavos:
          type: integer
          minimum: 1
          description: Importe exacto en la unidad mínima de la moneda.
        moneda:
          type: string
          pattern: '^[A-Z]{3}$'
    ImagenProducto:
      type: object
      additionalProperties: false
      required: [id, url, alt, orden]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          minLength: 1
        alt:
          type: string
        orden:
          type: integer
          minimum: 0
    VendedorResumen:
      type: object
      additionalProperties: false
      required: [id, nombreComercial]
      properties:
        id:
          type: string
          format: uuid
        nombreComercial:
          type: string
    ProductoResumen:
      type: object
      additionalProperties: false
      required:
        - id
        - nombre
        - descripcion
        - categoria
        - tipoEntrega
        - precio
        - imagenPrincipal
        - disponible
        - vendedor
        - creadoEn
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        descripcion:
          type: string
        categoria:
          $ref: '#/components/schemas/CategoriaProducto'
        tipoEntrega:
          type: string
          enum: [FISICA, DIGITAL]
        precio:
          $ref: '#/components/schemas/PrecioProducto'
        imagenPrincipal:
          anyOf:
            - $ref: '#/components/schemas/ImagenProducto'
            - type: 'null'
        disponible:
          type: [integer, 'null']
          minimum: 0
          description: Unidades disponibles; null para entrega digital.
        vendedor:
          $ref: '#/components/schemas/VendedorResumen'
        creadoEn:
          type: string
          format: date-time
    ProductoDetalle:
      type: object
      additionalProperties: false
      required:
        - id
        - nombre
        - descripcion
        - categoria
        - tipoEntrega
        - precio
        - imagenPrincipal
        - disponible
        - vendedor
        - creadoEn
        - sku
        - imagenes
        - actualizadoEn
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        descripcion:
          type: string
        categoria:
          $ref: '#/components/schemas/CategoriaProducto'
        tipoEntrega:
          type: string
          enum: [FISICA, DIGITAL]
        precio:
          $ref: '#/components/schemas/PrecioProducto'
        imagenPrincipal:
          anyOf:
            - $ref: '#/components/schemas/ImagenProducto'
            - type: 'null'
        disponible:
          type: [integer, 'null']
          minimum: 0
        vendedor:
          $ref: '#/components/schemas/VendedorResumen'
        creadoEn:
          type: string
          format: date-time
        sku:
          type: string
          minLength: 1
        imagenes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ImagenProducto'
        actualizadoEn:
          type: string
          format: date-time
    PaginacionCatalogo:
      type: object
      additionalProperties: false
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 48
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 1
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          enum: [nexusmarket-backend]
        version:
          type: string
          enum: [0.1.0]
    ReadyResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    NotReadyResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [not_ready]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [codigo, mensaje, correlationId]
          properties:
            codigo:
              type: string
              enum:
                - VALIDACION_INVALIDA
                - CONFLICTO_UNICIDAD
                - REGLA_NEGOCIO_INCUMPLIDA
                - DEPENDENCIA_NO_DISPONIBLE
                - NO_AUTENTICADO
                - NO_AUTORIZADO
                - RUTA_NO_ENCONTRADA
                - RECURSO_NO_ENCONTRADO
                - METODO_NO_PERMITIDO
                - ERROR_INTERNO
            mensaje:
              type: string
            correlationId:
              type: string
            detalles:
              type: object
              additionalProperties: true
    LoginRequest:
      type: object
      additionalProperties: false
      required: [correoElectronico, credencial]
      properties:
        correoElectronico:
          type: string
          minLength: 1
          format: email
        credencial:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    RolSistema:
      type: string
      enum: [COMPRADOR, VENDEDOR, OPERADOR_LOGISTICO, ADMINISTRADOR, SUPERVISOR]
    EstadoUsuario:
      type: string
      enum: [ACTIVO, INACTIVO, BLOQUEADO]
    AuthenticatedUser:
      type: object
      additionalProperties: false
      required:
        - usuarioId
        - nombreCompleto
        - correoElectronico
        - rol
        - estado
        - compradorId
        - sellerId
      properties:
        usuarioId:
          type: string
          format: uuid
        nombreCompleto:
          type: string
        correoElectronico:
          type: string
          format: email
        rol:
          $ref: '#/components/schemas/RolSistema'
        estado:
          $ref: '#/components/schemas/EstadoUsuario'
        compradorId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        sellerId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
    LoginResponse:
      type: object
      additionalProperties: false
      required: [token, expiraEn, usuario]
      properties:
        token:
          type: string
          minLength: 1
          description: Token opaco; también se entrega en la cookie HttpOnly.
        expiraEn:
          type: string
          format: date-time
        usuario:
          $ref: '#/components/schemas/AuthenticatedUser'
    LoginEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/LoginResponse'
    SessionResponse:
      type: object
      additionalProperties: false
      required: [usuario]
      properties:
        usuario:
          $ref: '#/components/schemas/AuthenticatedUser'
    SessionEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SessionResponse'
    Address:
      type: object
      additionalProperties: false
      required:
        - id
