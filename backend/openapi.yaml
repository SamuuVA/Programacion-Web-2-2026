          type: string
          minLength: 1
          maxLength: 30
        linea1:
          type: string
          minLength: 1
          maxLength: 160
        linea2:
          type: [string, 'null']
          maxLength: 160
        ciudad:
          type: string
          minLength: 1
          maxLength: 80
        region:
          type: string
          minLength: 1
          maxLength: 80
        codigoPostal:
          type: [string, 'null']
          maxLength: 20
        pais:
          type: string
          minLength: 2
          maxLength: 2
          default: CO
          description: Código ISO 3166-1 alfa-2.
        esPrincipal:
          type: boolean
    UpdateAddressRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        destinatario:
          type: string
          minLength: 1
          maxLength: 120
        telefono:
          type: string
          minLength: 1
          maxLength: 30
        linea1:
          type: string
          minLength: 1
          maxLength: 160
        linea2:
          type: [string, 'null']
          maxLength: 160
        ciudad:
          type: string
          minLength: 1
          maxLength: 80
        region:
          type: string
          minLength: 1
          maxLength: 80
        codigoPostal:
          type: [string, 'null']
          maxLength: 20
        pais:
          type: string
          minLength: 2
          maxLength: 2
    AddressListEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Address'
    AddressEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Address'
    WarehouseInput:
      type: object
      additionalProperties: false
