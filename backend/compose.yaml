services:
  postgres:
    image: postgres:17-alpine
    container_name: nexusmarket-postgres
    environment:
      POSTGRES_DB: nexusmarket
      POSTGRES_USER: nexusmarket
      POSTGRES_PASSWORD: nexusmarket
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nexusmarket-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusmarket -d nexusmarket"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexusmarket-postgres-data:
